name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.component.name }} ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
        component:
          - name: auth-server
            path: auth-server
          - name: auth-client
            path: auth-client/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Check formatting
        working-directory: ${{ matrix.component.path }}
        run: test -z "$(gofmt -l .)"
      - name: Test
        working-directory: ${{ matrix.component.path }}
        run: GOWORK=off go test ./...
      - name: Vet
        working-directory: ${{ matrix.component.path }}
        run: GOWORK=off go vet ./...
      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ matrix.go-version }}
          go-package: ./...
          work-dir: ${{ matrix.component.path }}
          cache: false

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy auth-client/python/src
      - run: uv run pytest -q
      - run: uv run pip-audit --skip-editable
      - run: uv build
      - run: uv build --project auth-client/python

  typescript:
    name: TypeScript SDK Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            auth-client/typescript/package-lock.json
            examples/typescript-mcp/package-lock.json
      - run: npm ci
        working-directory: auth-client/typescript
      - run: npm test
        working-directory: auth-client/typescript
      - run: npm audit --audit-level=high
        working-directory: auth-client/typescript
      - if: matrix.node-version == '24'
        run: npm ci
        working-directory: examples/typescript-mcp
      - if: matrix.node-version == '24'
        run: npm run typecheck
        working-directory: examples/typescript-mcp
      - if: matrix.node-version == '24'
        run: npm audit --audit-level=high
        working-directory: examples/typescript-mcp

  e2e:
    name: MCP authorization E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            auth-client/typescript/package-lock.json
            examples/typescript-mcp/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra fastmcp --python 3.12
      - run: npm ci
        working-directory: auth-client/typescript
      - run: npm run build
        working-directory: auth-client/typescript
      - run: npm ci
        working-directory: examples/typescript-mcp
      - name: Build authorization server
        working-directory: auth-server
        run: go build -trimpath -o "${{ runner.temp }}/mcp-auth-server" ./cmd/auth-server
      - name: Build Go MCP resource server
        working-directory: examples/go-mcp
        run: GOWORK=off go build -trimpath -o "${{ runner.temp }}/go-mcp-server" .
      - name: Exercise Python, Go, and TypeScript SDK authorization flows
        env:
          MCP_AUTH_SERVER_BINARY: ${{ runner.temp }}/mcp-auth-server
          MCP_AUTH_GO_SERVER_BINARY: ${{ runner.temp }}/go-mcp-server
        run: uv run pytest tests/e2e -m e2e -q

  compose-e2e:
    name: Compose MCP authorization E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Run production-mode OAuth compatibility flow with mock OIDC and submodule resource server
        run: >-
          docker compose -f deploy/docker-compose.e2e.yml up
          --build --abort-on-container-exit --exit-code-from e2e-client
      - name: Tear down E2E services
        if: always()
        run: docker compose -f deploy/docker-compose.e2e.yml down --volumes --remove-orphans

  public-audit:
    name: Public repository audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked files for secrets and private artifacts
        shell: bash
        run: bash scripts/audit-public-repo.sh

  docker:
    name: Authorization server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag mcp-auth-server:ci auth-server
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-auth-server:ci
          format: table
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
