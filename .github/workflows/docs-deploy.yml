name: Docs build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/docs/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-auth-docs-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build docs (fails on dead links)
        run: npm run docs:build
      - name: Validate Caddy and Compose configuration
        run: |
          sh -n deploy/docs/publish.sh
          docker run --rm -v "$PWD/deploy/docs/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker compose -f deploy/docs/compose.yaml config --quiet
      - name: Package site
        run: |
          mkdir "$RUNNER_TEMP/stage"
          cp -R docs/.vitepress/dist "$RUNNER_TEMP/stage/docs"
          tar -czf "$RUNNER_TEMP/docs-site.tgz" -C "$RUNNER_TEMP/stage" docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-site.tgz
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: docs-production
    env:
      DEPLOY_HOST: ${{ vars.DOCS_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DOCS_DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DOCS_DEPLOY_PORT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
      - name: Configure deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DOCS_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/docs-deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Publish release
        run: |
          ssh -i "$HOME/.ssh/docs-deploy" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "publish $GITHUB_SHA" < docs-site.tgz
      - name: Verify public HTTPS deployment
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 \
            https://mcp-auth.tavric-labs.net/docs/_deployment.json |
            python3 -c 'import json,os,sys; assert json.load(sys.stdin)["revision"] == os.environ["GITHUB_SHA"]'
          curl --fail --silent --show-error https://mcp-auth.tavric-labs.net/docs/ -o /dev/null
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$HOME/.ssh/docs-deploy"
